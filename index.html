<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SocialOS</title>
  <link rel="icon" id="favicon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300..800;1,400..700&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
/* =====================================================================
   Identidade visual Piovezan (Manual de Marca)
   Creme #F4EFE6 · Tinta #1C1B18 · Vermelho #A41815 · Oliva #ABA994
   Gotham → Montserrat · DIN Pro → Barlow (equivalentes livres)
   ===================================================================== */
:root{
  --bg:#F4EFE6;
  --side:#ECE5D7;
  --panel:#FBF8F2;
  --elev:#FFFDF9;
  --hover:#EAE2D3;
  --border:#E1D8C7;
  --border2:#D2C7B2;
  --border3:#BDB099;
  --text:#1C1B18;
  --text2:#47433B;
  --muted:#7B7568;
  --faint:#AFA796;
  --brand2:#ABA994;
  --accent:#A41815;
  --accent-soft:color-mix(in srgb,var(--accent) 11%,transparent);
  --danger:#C2410C;
  --ok:#4D7C4A;
  --warn:#B7791F;
  --r:14px;
  --shadow:0 24px 60px -22px rgba(70,52,20,.32);
  --shadow-sm:0 14px 30px -18px rgba(70,52,20,.35);
  --menu:#FFFDF9;
  --overlay:rgba(28,27,24,.34);
  --media:#E7DFCF;
  --day-other:rgba(171,169,148,.13);
  --check:#B5AA95;
  --code:#A41815;
  --pill-mix:60%;
  --pill-base:#1C1B18;
  --scroll:#D2C7B2;
  --scroll-h:#BDB099;
  --glow-mix:6%;
  --font:'Montserrat',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-din:'Barlow','DIN Pro','DIN',system-ui,sans-serif;
  color-scheme:light;
}
/* variação escura (o Manual permite o escuro só como variação) */
:root[data-theme="dark"]{
  --bg:#1C1B18;
  --side:#171613;
  --panel:#22201C;
  --elev:#2A2823;
  --hover:#34312A;
  --border:#38352E;
  --border2:#47433B;
  --border3:#5A554B;
  --text:#F4EFE6;
  --text2:#D2CABB;
  --muted:#9C9586;
  --faint:#646055;
  --accent-soft:color-mix(in srgb,var(--accent) 22%,transparent);
  --danger:#F07142;
  --ok:#7FB27A;
  --shadow:0 24px 70px -20px rgba(0,0,0,.7);
  --shadow-sm:0 14px 30px -16px rgba(0,0,0,.8);
  --menu:#26241F;
  --overlay:rgba(8,7,6,.6);
  --media:#11100E;
  --day-other:rgba(0,0,0,.18);
  --check:#6A655A;
  --code:#F0A39A;
  --pill-mix:78%;
  --pill-base:#FFFFFF;
  --scroll:#45413A;
  --scroll-h:#5A554B;
  --glow-mix:12%;
  
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13.5px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.35;cursor:default}
a{color:inherit;text-decoration:none}
::selection{background:color-mix(in srgb,var(--accent) 45%,transparent)}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:10px;border:2px solid transparent;background-clip:padding-box}
*::-webkit-scrollbar-thumb:hover{background-color:var(--scroll-h)}
*::-webkit-scrollbar-track{background:transparent}
.ic{flex:none;display:block}
.muted{color:var(--muted)}
.small{font-size:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row.tight{gap:2px;flex-wrap:nowrap}
.spacer{flex:1}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);height:100vh;overflow:hidden}
.sidebar{display:flex;flex-direction:column;gap:4px;padding:14px 10px 10px;background:var(--side);border-right:1px solid var(--border);min-height:0}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 12px;min-width:0}
.logo{width:30px;height:30px;flex:none;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:15px;color:#fff;background:linear-gradient(140deg,var(--accent),color-mix(in srgb,var(--accent) 45%,#000));box-shadow:0 6px 22px -6px var(--accent),inset 0 1px 0 rgba(255,255,255,.25)}
.logo.emoji{background:var(--elev);box-shadow:inset 0 0 0 1px var(--border2);font-size:17px}
.logo.lg{width:44px;height:44px;border-radius:12px;font-size:20px}
.logo.lg.emoji{font-size:24px}
.brand-name{font-weight:700;font-size:15px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.new-post{margin-bottom:6px}
.nav{display:flex;flex-direction:column;gap:2px;margin:6px 0}
.nav-item{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:var(--text2);cursor:pointer;user-select:none;font-weight:500;transition:background .12s,color .12s}
.nav-item:hover{background:var(--hover);color:var(--text)}
.nav-item.active{background:var(--accent-soft);color:var(--text)}
.nav-item.active .ic{color:var(--accent)}
.nav-count{margin-left:auto;font-size:11px;color:var(--muted);font-weight:600}
.nav-count.bad{color:#fff;background:var(--danger);padding:0 7px;border-radius:10px;line-height:18px}
.side-label{display:flex;align-items:center;justify-content:space-between;padding:12px 6px 4px 10px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.page-list{flex:1;overflow:auto;display:flex;flex-direction:column;gap:1px;min-height:0}
.page-item{display:flex;gap:9px;align-items:center;padding:5px 10px;border-radius:7px;color:var(--text2);cursor:pointer;min-width:0}
.page-item:hover{background:var(--hover);color:var(--text)}
.page-item.active{background:var(--hover);color:var(--text)}
.pi-ic{width:18px;text-align:center;flex:none}
.pi-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-empty{color:var(--faint);font-size:12px;padding:6px 10px}
.side-foot{border-top:1px solid var(--border);padding-top:8px;margin-top:4px}
.save-ind{font-size:11px;color:var(--muted);padding:6px 10px 0;display:flex;align-items:center;gap:6px}
.save-ind.saving{color:var(--warn)}
.save-ind.err{color:var(--danger)}

.main{overflow:auto;min-width:0;position:relative;background:radial-gradient(900px 340px at 85% -90px,color-mix(in srgb,var(--accent) var(--glow-mix),transparent),transparent 70%),var(--bg)}
.view{padding:30px 38px 70px;max-width:1360px;margin:0 auto}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.vh h1{font-size:27px;letter-spacing:-.025em;margin:0;font-weight:750}
.sub{margin:4px 0 0;color:var(--muted)}
.vh-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:9px;border:1px solid var(--border2);background:var(--elev);color:var(--text);font-weight:550;font-size:13px;transition:background .15s,border-color .15s,filter .15s,transform .08s;white-space:nowrap}
.btn:hover{background:var(--hover);border-color:var(--border3)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);border-color:transparent;color:#fff;box-shadow:0 10px 26px -12px var(--accent),inset 0 1px 0 rgba(255,255,255,.18)}
.btn.primary:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--text2)}
.btn.ghost:hover{background:var(--hover);color:var(--text)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 35%,transparent);background:color-mix(in srgb,var(--danger) 8%,transparent)}
.btn.sm{height:28px;padding:0 10px;font-size:12px;border-radius:7px}
.w100{width:100%;justify-content:center}
.icon-btn{width:30px;height:30px;display:inline-grid;place-items:center;border-radius:8px;border:0;background:transparent;color:var(--text2);flex:none}
.icon-btn:hover:not(:disabled){background:var(--hover);color:var(--text)}
.icon-btn.xs{width:22px;height:22px;border-radius:6px}

/* ---------- badges ---------- */
.net{display:inline-grid;place-items:center;min-width:22px;height:18px;padding:0 5px;border-radius:5px;font-size:10px;font-weight:800;color:color-mix(in srgb,var(--c) var(--pill-mix),var(--pill-base));background:color-mix(in srgb,var(--c) 17%,transparent);letter-spacing:.02em;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:550;background:color-mix(in srgb,var(--c) 14%,transparent);color:color-mix(in srgb,var(--c) var(--pill-mix),var(--pill-base));white-space:nowrap}
.pill::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--c)}
.tag{font-size:11px;color:var(--text2);background:var(--hover);padding:1px 7px;border-radius:5px;white-space:nowrap}

/* ---------- panels / dashboard ---------- */
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:18px}
.panel h3{margin:0 0 14px;font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.07em;display:flex;align-items:center;justify-content:space-between;gap:8px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:14px}
.stat{position:relative;overflow:hidden;cursor:default}
.stat-l{color:var(--muted);font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:7px}
.stat-v{font-size:34px;font-weight:750;letter-spacing:-.035em;margin-top:6px;line-height:1.1}
.stat-s{font-size:12px;color:var(--muted);margin-top:2px}
.stat.bad .stat-v{color:var(--danger)}
.stat::after{content:'';position:absolute;right:-40px;top:-40px;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,var(--glow,var(--accent-soft)),transparent 68%);pointer-events:none}
.dash-grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:14px;align-items:start}
.dash-col{display:flex;flex-direction:column;gap:14px;min-width:0}
.bars{display:flex;flex-direction:column;gap:11px}
.bar-row{display:grid;grid-template-columns:112px 1fr 26px;gap:10px;align-items:center;font-size:13px}
.bar-l{display:flex;align-items:center;gap:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text2)}
.bar-l i{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.bar{height:8px;border-radius:99px;background:var(--hover);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--c);min-width:2px;transition:width .4s}
.bar-n{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.plist{display:flex;flex-direction:column;gap:1px}
.prow{display:grid;grid-template-columns:46px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px;border-radius:10px;cursor:pointer}
.prow:hover{background:var(--hover)}
.pdate{text-align:center;line-height:1.15;border:1px solid var(--border);border-radius:9px;padding:5px 0;background:var(--elev)}
.pdate b{display:block;font-size:16px;font-weight:700}
.pdate small{font-size:9.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.prow.late .pdate{border-color:color-mix(in srgb,var(--danger) 45%,transparent)}
.prow.late .pdate b{color:var(--danger)}
.ptitle{font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmeta{display:flex;gap:7px;align-items:center;font-size:12px;color:var(--muted);margin-top:2px;min-width:0}
.pthumb{width:38px;height:38px;border-radius:8px;object-fit:cover;border:1px solid var(--border)}
.empty{color:var(--muted);font-size:13px;padding:16px 8px;text-align:center}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qa .btn{justify-content:center;height:40px}
.recent{display:flex;flex-direction:column;gap:1px}

/* ---------- filters ---------- */
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fchip{height:28px;padding:0 11px;border-radius:999px;border:1px solid var(--border2);background:transparent;color:var(--text2);font-size:12px;font-weight:550;display:inline-flex;align-items:center;gap:6px}
.fchip:hover{background:var(--hover);color:var(--text)}
.fchip i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.fchip.on{background:var(--elev);color:var(--text);border-color:color-mix(in srgb,var(--c,var(--accent)) 65%,transparent)}

/* ---------- kanban ---------- */
.view-kanban{max-width:none;display:flex;flex-direction:column;height:100%;padding-bottom:16px}
.board{display:flex;gap:var(--colgap,14px);overflow-x:auto;padding-bottom:12px;align-items:flex-start;flex:1;min-height:0}
.col{flex:0 0 var(--colw,286px);background:color-mix(in srgb,var(--panel) 75%,transparent);border:1px solid var(--border);border-radius:16px;display:flex;flex-direction:column;max-height:100%}
.col-head{display:flex;align-items:center;gap:8px;padding:12px 10px 8px 14px}
.col-head .dot{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 12px color-mix(in srgb,var(--c) 70%,transparent);flex:none}
.col-name{font-weight:650;font-size:13px;outline:none;border-radius:5px;padding:1px 4px;margin-left:-4px;cursor:default;min-width:20px}
.col-name[contenteditable=true]{background:var(--elev);box-shadow:0 0 0 1px var(--accent);cursor:text}
.col-done{color:var(--ok);display:inline-flex}
.count{font-size:11px;color:var(--muted);background:var(--hover);padding:0 7px;border-radius:99px;line-height:18px;font-weight:600}
.col-head .icon-btn{margin-left:auto}
.col-body{padding:4px 8px 8px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;min-height:56px;flex:1;border-radius:10px;transition:background .12s}
.col-body.over{background:var(--accent-soft)}
.drop-line{height:3px;border-radius:3px;background:var(--accent);box-shadow:0 0 10px var(--accent);margin:-3px 2px;flex:none}
.col-add{margin:0 8px 10px;justify-content:flex-start}
.card{background:var(--elev);border:1px solid var(--border);border-radius:12px;cursor:pointer;overflow:hidden;transition:border-color .15s,transform .15s,box-shadow .15s;flex:none}
.card:hover{border-color:var(--border3);box-shadow:var(--shadow-sm);transform:translateY(-1px)}
.card.dragging,.chip.dragging{opacity:.35}
.card-img{aspect-ratio:16/10;overflow:hidden;background:var(--media)}
.card-img img{width:100%;height:100%;object-fit:cover;display:block}
.card-body{padding:10px 12px 11px}
.card-title{font-weight:600;font-size:13.5px;line-height:1.35;margin-bottom:8px;word-break:break-word}
.card-title.untitled{color:var(--muted)}
.card-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.date{font-size:11px;color:var(--muted);display:inline-flex;gap:4px;align-items:center;white-space:nowrap}
.date.late{color:var(--danger)}
.prog{font-size:11px;color:var(--muted);display:inline-flex;gap:4px;align-items:center}
.prog.full{color:var(--ok)}
.col-new{flex:0 0 220px;height:46px;border:1px dashed var(--border2);border-radius:14px;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px;font-weight:550}
.col-new:hover{color:var(--text);border-color:var(--accent);background:var(--accent-soft)}

/* ---------- list (database) ---------- */
.view-list{max-width:none}
.ltools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.lsearch{position:relative;display:block}
.lsearch .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.lsearch .input{padding-left:32px;width:270px;height:32px;font-size:13px}
.lselect{height:32px;background:var(--elev);border:1px solid var(--border2);border-radius:9px;color:var(--text);font:inherit;font-size:12.5px;padding:0 8px;cursor:pointer}
.lselect:focus{outline:0;border-color:var(--accent)}
.ltable-wrap{border:1px solid var(--border);border-radius:14px;background:var(--panel);overflow-x:auto}
.ltable{min-width:var(--lmin,1070px)}
.lhead,.lrow{display:grid;grid-template-columns:var(--lcols,minmax(260px,1fr) 115px 120px 125px 150px 125px 85px 85px);align-items:stretch}
.lhead{border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--elev) 55%,transparent)}
.lh{position:relative;padding:9px 12px;font-size:12px;color:var(--muted);font-weight:550;display:flex;gap:7px;align-items:center;cursor:pointer;user-select:none;border-right:1px solid var(--border);white-space:nowrap}
.lh:last-child,.lc:last-child{border-right:0}
.lh:hover{color:var(--text);background:var(--hover)}
.lh.on{color:var(--text)}
.lh.on .ic:last-child{color:var(--accent)}
.lrow{border-bottom:1px solid var(--border);transition:background .1s}
.lrow:hover{background:color-mix(in srgb,var(--hover) 55%,transparent)}
.lc{padding:4px 6px;min-width:0;border-right:1px solid var(--border);min-height:42px;display:flex;align-items:center}
.lc-title{gap:10px;cursor:pointer;padding-left:12px;position:relative}
.lc-title img{width:26px;height:26px;border-radius:6px;object-fit:cover;flex:none;border:1px solid var(--border)}
.lt-ic{color:var(--muted);display:flex;width:26px;justify-content:center;flex:none}
.lt-t{font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lt-t.untitled{color:var(--muted)}
.lt-open{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:9.5px;font-weight:700;letter-spacing:.07em;color:var(--text2);border:1px solid var(--border2);border-radius:5px;padding:2px 6px;opacity:0;background:var(--elev);transition:opacity .1s;flex:none}
.lrow:hover .lt-open{opacity:1}
.cell{width:100%;background:transparent;border:1px solid transparent;color:var(--text);font:inherit;font-size:13px;padding:4px 6px;border-radius:6px;cursor:pointer;min-width:0}
.cell:hover{background:var(--hover)}
.cell:focus{outline:0;border-color:var(--accent);background:var(--elev)}
.cell.late{color:var(--danger);font-weight:600}
.cell-net{color:color-mix(in srgb,var(--c) var(--pill-mix),var(--pill-base));font-weight:650}
select.pillsel{width:auto;max-width:100%;border-radius:999px;padding:3px 12px;background:color-mix(in srgb,var(--c) 15%,transparent);color:color-mix(in srgb,var(--c) var(--pill-mix),var(--pill-base));font-weight:550;font-size:12px;appearance:none;-webkit-appearance:none}
select.pillsel:hover{background:color-mix(in srgb,var(--c) 25%,transparent)}
.lgroup-h{display:flex;align-items:center;gap:8px;padding:11px 12px;font-size:13px;cursor:pointer;user-select:none;border-bottom:1px solid var(--border);background:color-mix(in srgb,var(--elev) 40%,transparent);color:var(--text2)}
.lgroup-h:hover{color:var(--text)}
.lgroup-h b{color:var(--text);font-weight:650}
.lgroup-h .dot{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 10px color-mix(in srgb,var(--c) 60%,transparent)}
.lnew{display:flex;align-items:center;gap:6px;width:100%;border:0;border-bottom:1px solid var(--border);background:transparent;color:var(--muted);padding:9px 14px;font-size:13px;text-align:left}
.lnew:hover{background:var(--hover);color:var(--text)}
.ltable>.lnew:last-child{border-bottom:0}
.lempty{padding:30px;text-align:center;color:var(--muted);border-bottom:1px solid var(--border)}
.faint{color:var(--faint)}

/* ---------- done state + check ---------- */
.dcheck{width:18px;height:18px;flex:none;border-radius:50%;border:1.5px solid var(--check);background:transparent;display:grid;place-items:center;color:transparent;padding:0;cursor:pointer;transition:background .15s,border-color .15s,color .15s,transform .1s}
.dcheck:hover{border-color:var(--ok);color:color-mix(in srgb,var(--ok) 70%,transparent)}
.dcheck:active{transform:scale(.9)}
.dcheck.on{background:var(--ok);border-color:var(--ok);color:#fff}
.dcheck .ic{stroke-width:3}
.is-done{opacity:.42;transition:opacity .2s}
.is-done:hover{opacity:.7}
.is-done .card-title,.is-done .lt-t,.is-done .chip-t,.is-done .ptitle,.is-done .peek-title{text-decoration:line-through;text-decoration-thickness:1.5px;text-decoration-color:color-mix(in srgb,var(--text) 70%,transparent)}
.is-done .dcheck{opacity:1}
.chip.is-done{opacity:.45}
.card-top{display:flex;gap:9px;align-items:flex-start;margin-bottom:8px}
.card-top .dcheck{margin-top:1px}
.card-top .card-title{margin-bottom:0}
.card-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.peek-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.peek-head .peek-title{margin-bottom:0}
.peek-head .dcheck{width:26px;height:26px}
.peek-head.is-done{opacity:1}
.peek-head.is-done .peek-title{opacity:.45}

/* ---------- tags / pills editáveis ---------- */
.pill.tagp{border-radius:6px;padding:0 8px}
.pill.tagp::before{display:none}
.pill.sm{height:19px;font-size:10.5px;padding:0 7px}
.pillbtn,.cellbtn{border:1px solid transparent;background:transparent;padding:3px 5px;border-radius:7px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;cursor:pointer;min-height:30px;text-align:left;font:inherit;color:inherit}
.pillbtn:hover,.cellbtn:hover{background:var(--hover)}
.pillbtn:focus-visible,.cellbtn:focus-visible{outline:0;border-color:var(--accent)}
.cellbtn{width:100%;flex-wrap:nowrap;overflow:hidden}
.cellbtn .pill{max-width:100%;overflow:hidden;text-overflow:ellipsis;flex:none}
.cellbtn.tags .pill{flex:0 1 auto;min-width:0}
.menu-pick{min-width:270px;max-width:310px}
.opick .op-in,.op-edit .op-name{height:32px;max-width:none;margin:2px 0 4px;font-size:13px}
.op-list{max-height:260px;overflow:auto}
.op-row{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:7px;cursor:pointer;min-height:32px}
.op-row:hover{background:var(--hover)}
.op-row .pill{max-width:190px;overflow:hidden;text-overflow:ellipsis}
.op-check{width:14px;color:var(--accent);display:flex;flex:none}
.op-more{margin-left:auto;opacity:0;border:0;background:transparent;color:var(--muted);border-radius:5px;width:26px;height:24px;display:grid;place-items:center;flex:none}
.op-row:hover .op-more{opacity:1}
.op-more:hover{background:var(--elev);color:var(--text)}
.op-create{color:var(--text2);font-size:13px}
.op-hint{font-size:11px;color:var(--faint);padding:6px 8px 2px}
.op-edit{padding:2px}
.op-custom{display:flex;align-items:center;justify-content:space-between;padding:4px 9px;font-size:12px;color:var(--text2);cursor:pointer}
.op-custom input[type=color]{width:26px;height:26px}
.netrow,.tagrow{display:grid;gap:8px;align-items:center;padding:6px 6px 6px 8px;border:1px solid var(--border);border-radius:11px;background:var(--bg);margin-bottom:6px}
.netrow{grid-template-columns:34px minmax(90px,1fr) 58px minmax(140px,2fr) 78px auto}
.tagrow{grid-template-columns:34px minmax(0,1fr) auto 64px auto}
.netrow .input,.tagrow .input{height:32px;max-width:none;background:transparent;border-color:transparent;font-size:13px}
.netrow .input:hover,.tagrow .input:hover{background:var(--hover)}
.netrow .input:focus,.tagrow .input:focus{background:var(--elev);border-color:var(--accent)}
.netrow .sigla{text-transform:none;text-align:center;padding:0 6px}
.netrow .lim{padding:0 8px}
.lhide{margin-left:4px}

/* ---------- calendar ---------- */
.view-calendar{max-width:none}
.cal-nav{display:flex;align-items:center;gap:4px}
.cal-title{font-weight:650;min-width:160px;text-align:center;font-size:15px}
.cal-wrap{display:grid;grid-template-columns:minmax(0,1fr) 236px;gap:14px;align-items:start}
.cal{border:1px solid var(--border);border-radius:16px;overflow:hidden;background:var(--panel)}
.cal-wd{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid var(--border)}
.cal-wd div{padding:9px 10px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.day{border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:6px;height:128px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-width:0;transition:background .12s}
.day:nth-child(7n){border-right:0}
.day:hover{background:color-mix(in srgb,var(--hover) 55%,transparent)}
.day.other{background:var(--day-other)}
.day.other .day-num{color:var(--faint)}
.day-head{display:flex;justify-content:space-between;align-items:center;flex:none}
.day-num{font-size:12px;font-weight:650;color:var(--text2);width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.day.today .day-num{background:var(--accent);color:#fff;box-shadow:0 0 14px -2px var(--accent)}
.day-add{opacity:0;color:var(--muted);transition:opacity .12s}
.day:hover .day-add{opacity:1}
.day.over,.tray.over{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.day-posts{display:flex;flex-direction:column;gap:3px;overflow-y:auto;min-height:0}
.chip{display:flex;align-items:center;gap:6px;padding:3px 7px 3px 5px;border-radius:6px;background:color-mix(in srgb,var(--c) 12%,var(--elev));border-left:3px solid var(--c);font-size:11.5px;cursor:pointer;min-width:0;flex:none}
.chip:hover{background:color-mix(in srgb,var(--c) 22%,var(--elev))}
.chip img{width:18px;height:18px;border-radius:4px;object-fit:cover;flex:none}
.chip-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip b{font-weight:650;color:var(--text2);font-variant-numeric:tabular-nums}

.chip.is-done .chip-t{text-decoration:line-through}
.chip.late{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--danger) 50%,transparent)}
.tray{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px;position:sticky;top:0}
.tray-head{display:flex;align-items:center;justify-content:space-between;font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.07em;padding:2px 2px 4px}
.tray-body{display:flex;flex-direction:column;gap:4px;max-height:60vh;overflow:auto}
.tray-body .chip{padding:6px 8px}

/* ---------- post peek ---------- */
.overlay{position:fixed;inset:0;background:var(--overlay);backdrop-filter:blur(3px);z-index:50;display:flex;justify-content:flex-end;animation:fade .15s}
.peek{width:min(780px,100%);height:100%;background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;box-shadow:var(--shadow);animation:slide .22s cubic-bezier(.2,.8,.2,1)}
@keyframes slide{from{transform:translateX(34px);opacity:0}}
@keyframes fade{from{opacity:0}}
.peek-bar{display:flex;align-items:center;gap:4px;padding:10px 14px;border-bottom:1px solid var(--border)}
.crumb{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.peek-scroll{overflow:auto;padding:24px 44px 90px;flex:1}
.media-slot{margin-bottom:20px}
.drop{width:100%;height:118px;border:1.5px dashed var(--border2);border-radius:14px;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:13px;transition:.15s}
.drop:hover,.media-slot.over .drop{border-color:var(--accent);color:var(--text);background:var(--accent-soft)}
.media{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--border);background:var(--media);display:flex;justify-content:center}
.media img{max-height:440px;max-width:100%;display:block;object-fit:contain}
.media-actions{position:absolute;right:10px;top:10px;display:flex;gap:6px;opacity:0;transition:.15s}
.media:hover .media-actions{opacity:1}
.media-slot.over .media{box-shadow:0 0 0 2px var(--accent)}
.peek-title{width:100%;background:transparent;border:0;outline:0;color:var(--text);font-size:30px;font-weight:750;letter-spacing:-.025em;padding:0;margin-bottom:14px;font-family:inherit}
.peek-title::placeholder{color:var(--faint)}
.props{display:grid;gap:2px;margin-bottom:24px;padding-bottom:18px;border-bottom:1px solid var(--border)}
.prop{display:grid;grid-template-columns:130px minmax(0,1fr);align-items:center;min-height:34px}
.prop-l{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:8px}
.prop-v{display:flex;align-items:center;gap:8px;min-width:0}
.prop select,.prop input{background:transparent;border:1px solid transparent;color:var(--text);font:inherit;font-size:13.5px;padding:5px 8px;border-radius:7px;max-width:260px;cursor:pointer}
.prop select:hover,.prop input:hover{background:var(--hover)}
.prop select:focus,.prop input:focus{outline:0;border-color:var(--accent);background:var(--elev)}
select option{background:var(--elev);color:var(--text)}
.sec{margin-bottom:26px}
.sec-head{display:flex;align-items:center;gap:10px;margin-bottom:9px;flex-wrap:wrap}
.sec-head h3{margin:0;font-weight:650;color:var(--text2);text-transform:uppercase;letter-spacing:.07em;font-size:11.5px}
.counter{font-size:12px;color:var(--muted);margin-right:auto;font-variant-numeric:tabular-nums}
.counter.bad{color:var(--danger);font-weight:600}
.ta{width:100%;min-height:120px;resize:vertical;background:var(--bg);border:1px solid var(--border);border-radius:12px;color:var(--text);font:inherit;font-size:14px;line-height:1.65;padding:12px 14px;outline:0;transition:border-color .15s,box-shadow .15s}
.ta:focus{border-color:color-mix(in srgb,var(--accent) 70%,transparent);box-shadow:0 0 0 3px var(--accent-soft)}
.ta.sm{min-height:62px;color:color-mix(in srgb,var(--accent) 75%,var(--text))}
.ta::placeholder{color:var(--faint)}

/* ---------- block editor ---------- */
.editor{position:relative}
.blk{position:relative;display:flex}
.blk-handle{position:absolute;left:-28px;top:4px;width:22px;height:24px;display:grid;place-items:center;color:var(--muted);opacity:0;cursor:grab;border-radius:5px;transition:opacity .1s}
.blk:hover .blk-handle{opacity:1}
.blk-handle:hover{background:var(--hover);color:var(--text)}
.blk-body{flex:1;display:flex;align-items:flex-start;gap:6px;min-width:0}
.bc{flex:1;outline:0;min-height:1.65em;padding:3px 2px;line-height:1.65;white-space:pre-wrap;word-break:break-word;min-width:0;font-size:15px}
.bc:empty::before{content:attr(data-ph);color:var(--faint);pointer-events:none}
.t-text .bc:empty::before{content:''}
.t-text .bc:empty:focus::before{content:attr(data-ph)}
.t-h1 .bc{font-size:28px;font-weight:750;letter-spacing:-.025em;line-height:1.3;margin-top:16px}
.t-h2 .bc{font-size:21px;font-weight:700;line-height:1.35;margin-top:14px;letter-spacing:-.015em}
.t-h3 .bc{font-size:17px;font-weight:650;margin-top:8px}
.t-h1 .blk-handle{top:22px}.t-h2 .blk-handle{top:18px}.t-h3 .blk-handle{top:10px}
.marker{width:22px;flex:none;text-align:center;line-height:1.65;padding-top:3px;color:var(--text2);font-size:15px}
.marker.num{font-variant-numeric:tabular-nums;font-size:14px}
.todo-box{padding:7px 3px 0;flex:none;display:flex}
.todo-box input{appearance:none;-webkit-appearance:none;width:16px;height:16px;border:1.5px solid var(--check);border-radius:4px;margin:0;cursor:pointer;display:grid;place-items:center;transition:.12s;background:transparent}
.todo-box input:hover{border-color:var(--accent)}
.todo-box input:checked{background:var(--accent);border-color:var(--accent)}
.todo-box input:checked::after{content:'';width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:translate(0,-1px) rotate(45deg)}
.blk.checked .bc{color:var(--muted);text-decoration:line-through}
.t-quote .blk-body{border-left:3px solid var(--text2);padding-left:14px;margin:3px 0}
.t-quote .bc{font-size:16px;color:var(--text2)}
.t-callout .blk-body{background:var(--elev);border:1px solid var(--border);border-radius:12px;padding:10px 14px;margin:5px 0;gap:10px}
.callout-ic{font-size:18px;line-height:1.65;padding-top:2px}
.t-divider .blk-body{padding:6px 0}
.t-divider hr{border:0;border-top:1px solid var(--border2);margin:8px 0;width:100%}
figure{margin:6px 0;flex:1}
figure img{max-width:100%;border-radius:12px;display:block;border:1px solid var(--border)}
.img-empty{flex:1;padding:18px;border-radius:12px;background:var(--elev);color:var(--muted);display:flex;gap:8px;align-items:center;cursor:pointer;margin:4px 0;border:1px dashed var(--border2)}
.img-empty:hover{color:var(--text);border-color:var(--accent)}
.blk.drop-before::before,.blk.drop-after::after{content:'';position:absolute;left:0;right:0;height:3px;background:var(--accent);border-radius:3px;box-shadow:0 0 8px var(--accent);z-index:2}
.blk.drop-before::before{top:-2px}
.blk.drop-after::after{bottom:-2px}
.blk.dragging{opacity:.3}
.editor-tail{height:70px;cursor:text}
.bc a{color:var(--accent);text-decoration:underline}
.bc code{background:var(--hover);padding:1px 6px;border-radius:5px;font-size:.88em;font-family:ui-monospace,"Cascadia Code",Consolas,monospace;color:var(--code)}
.bc b,.bc strong{font-weight:650}

/* ---------- menus ---------- */
.menu{position:fixed;z-index:100;min-width:220px;max-width:310px;max-height:min(440px,72vh);overflow:auto;background:var(--menu);border:1px solid var(--border2);border-radius:12px;padding:5px;box-shadow:var(--shadow);animation:pop .12s}
@keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}}
.menu-item{width:100%;display:flex;align-items:center;gap:10px;padding:6px 9px;border:0;background:transparent;border-radius:7px;text-align:left;font-size:13px;color:var(--text);cursor:pointer}
.menu-item:hover,.menu-item.sel{background:var(--hover)}
.menu-item.danger{color:var(--danger)}
.menu-item:disabled{opacity:.35;pointer-events:none}
.menu-item.active{color:var(--accent)}
.mi-ic{width:20px;display:grid;place-items:center;color:var(--text2);flex:none}
.mi-box{width:34px;height:34px;flex:none;border-radius:8px;background:var(--elev);border:1px solid var(--border);display:grid;place-items:center;font-size:12px;font-weight:750;color:var(--text2)}
.menu:not(.slash) .mi-box{width:22px;height:22px;font-size:10px;border-radius:6px}
.menu-item small{display:block;color:var(--muted);font-size:11.5px;font-weight:400;line-height:1.3}
.menu-item b{font-weight:550}
.mi-hint{margin-left:auto;color:var(--muted);font-size:11px;padding-left:8px}
.menu-sep{height:1px;background:var(--border);margin:5px 4px}
.menu-label{font-size:10.5px;color:var(--muted);padding:7px 9px 4px;font-weight:650;text-transform:uppercase;letter-spacing:.07em}
.menu-empty{padding:10px;color:var(--muted);font-size:13px}
.swatches{display:flex;flex-wrap:wrap;gap:6px;padding:6px 8px}
.sw{width:22px;height:22px;border-radius:7px;border:2px solid transparent;cursor:pointer;background:var(--c);padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.sw:hover{transform:scale(1.1)}
.sw.on{border-color:var(--text)}
.emoji-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;padding:4px}
.emoji-grid button{border:0;background:transparent;font-size:19px;padding:4px;border-radius:7px;line-height:1.3}
.emoji-grid button:hover{background:var(--hover)}

/* ---------- docs ---------- */
.view-doc{max-width:880px;padding-top:18px}
.doc-top{display:flex;align-items:center;gap:6px;margin-bottom:34px}
.doc{padding-left:30px}
.doc-icon{font-size:56px;line-height:1;background:transparent;border:0;padding:6px;border-radius:14px;margin-left:-6px}
.doc-icon:hover{background:var(--hover)}
.doc-title{font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1.2;outline:0;margin:10px 0 6px;word-break:break-word}
.doc-title:empty::before{content:attr(data-ph);color:var(--faint)}
.doc-desc{width:100%;background:transparent;border:0;outline:0;color:var(--text2);font:inherit;font-size:15px;padding:0;margin-bottom:6px}
.doc-desc::placeholder{color:var(--faint)}
.doc-meta{color:var(--muted);font-size:12px;margin-bottom:24px;display:flex;gap:10px;align-items:center}
.not-found{text-align:center;padding:80px 20px;color:var(--muted)}

/* ---------- templates ---------- */
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.tpl-card{display:flex;flex-direction:column;gap:8px;transition:border-color .15s,transform .15s}
.tpl-card:hover{border-color:var(--border3);transform:translateY(-2px)}
.tpl-ic{font-size:30px;line-height:1}
.tpl-name{font-weight:650;font-size:15.5px;letter-spacing:-.01em}
.tpl-card p{margin:0;color:var(--muted);font-size:13px}
.tpl-prev{font-size:12px;color:var(--text2);background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:3px;flex:1;min-height:96px}
.tpl-prev span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tpl-prev .h{font-weight:650;color:var(--text)}
.tpl-actions{display:flex;gap:6px;margin-top:4px;align-items:center}
.badge{font-size:10.5px;color:var(--muted);border:1px solid var(--border2);border-radius:99px;padding:0 7px;line-height:17px}

/* ---------- settings ---------- */
.view-settings{max-width:1000px}
.set-sec{display:grid;grid-template-columns:250px minmax(0,1fr);gap:28px;margin-bottom:14px}
.set-sec h2{font-size:15px;margin:0 0 4px;letter-spacing:-.01em}
.hint{color:var(--muted);font-size:13px;margin:0}
.field-row{display:flex;flex-direction:column;gap:7px;margin-bottom:18px}
.field-row:last-child{margin-bottom:0}
.field-row>label{font-size:12px;color:var(--text2);font-weight:550}
.input{height:36px;background:var(--bg);border:1px solid var(--border2);border-radius:9px;color:var(--text);font:inherit;padding:0 12px;outline:0;width:100%;max-width:360px}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.colrow{display:grid;grid-template-columns:34px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:6px 6px 6px 8px;border:1px solid var(--border);border-radius:11px;background:var(--bg);margin-bottom:6px}
.colrow .input{height:32px;max-width:none;background:transparent;border-color:transparent}
.colrow .input:hover{background:var(--hover)}
.colrow .input:focus{background:var(--elev);border-color:var(--accent)}
input[type=color]{width:30px;height:30px;border:0;padding:0;background:transparent;cursor:pointer;border-radius:8px}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:0;border-radius:8px}
input[type=color]::-moz-color-swatch{border:0;border-radius:8px}
.check{display:inline-flex;gap:6px;align-items:center;font-size:12px;color:var(--text2);cursor:pointer;white-space:nowrap}
.check input{accent-color:var(--accent)}
.danger-zone{margin-top:18px;padding-top:18px;border-top:1px solid var(--border)}
.stat-line{margin:12px 0 0}

/* ---------- toast ---------- */
#toast-root{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--menu);border:1px solid var(--border2);padding:10px 16px;border-radius:11px;font-size:13px;box-shadow:var(--shadow);animation:pop .15s;display:flex;gap:8px;align-items:center}
.toast .ic{color:var(--ok)}

/* ---------- mobile ---------- */
.mobile-bar{display:none}
.nav-scrim{display:none}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:fixed;inset:0 auto 0 0;width:272px;z-index:60;transform:translateX(-100%);transition:transform .22s}
  .app.nav-open .sidebar{transform:none;box-shadow:var(--shadow)}
  .app.nav-open .nav-scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:55}
  .mobile-bar{display:flex;position:fixed;top:0;left:0;right:0;height:52px;align-items:center;gap:10px;padding:0 10px;background:var(--side);border-bottom:1px solid var(--border);z-index:40;font-weight:650}
  .main{padding-top:52px}
  .view{padding:20px 16px 60px}
  .vh h1{font-size:23px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .stat-v{font-size:28px}
  .dash-grid{grid-template-columns:minmax(0,1fr)}
  .cal-wrap{grid-template-columns:minmax(0,1fr)}
  .cal-title{min-width:0}
  .day{height:84px;padding:3px}
  .chip{padding:2px 4px;font-size:10.5px}
  .chip img,.chip b{display:none}
  .tray{position:static}
  .lsearch,.lsearch .input{width:100%;max-width:none}
  .ltools .spacer{display:none}
  .netrow{grid-template-columns:34px minmax(0,1fr) 58px auto}
  .netrow [data-netf="formats"]{grid-column:1/-2}
  .tagrow{grid-template-columns:34px minmax(0,1fr) auto}
  .tagrow .tagp,.tagrow .muted{display:none}

  .peek-scroll{padding:18px 18px 70px}
  .blk-handle{display:none}
  .prop{grid-template-columns:96px minmax(0,1fr)}
  .set-sec{grid-template-columns:minmax(0,1fr);gap:12px}
  .colrow{grid-template-columns:34px minmax(0,1fr) auto}
  .colrow .row.tight{grid-column:1/-1;justify-content:flex-end}
  .doc{padding-left:0}
  .doc-title{font-size:30px}
  .view-kanban{height:auto}
  .col{max-height:none}
}

/* ---------- colunas ajustáveis ---------- */

/* ---------------- storage ---------------- */
const DB = {
  db: null,
  open() {
    return new Promise(res => {
      try {
        const r = indexedDB.open('socialos', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => { this.db = r.result; res(); };
        r.onerror = () => res();
      } catch { res(); }
    });
  },
  get(k) {
    return new Promise(res => {
      if (!this.db) { try { res(JSON.parse(localStorage.getItem('socialos-' + k))); } catch { res(null); } return; }
      const q = this.db.transaction('kv').objectStore('kv').get(k);
      q.onsuccess = () => res(q.result ?? null); q.onerror = () => res(null);
    });
  },
  set(k, v) {
    return new Promise(res => {
      if (!this.db) { try { localStorage.setItem('socialos-' + k, JSON.stringify(v)); res(true); } catch { res(false); } return; }
      try {
        const tx = this.db.transaction('kv', 'readwrite');
        tx.objectStore('kv').put(v, k);
        tx.oncomplete = () => res(true); tx.onerror = () => res(false); tx.onabort = () => res(false);
      } catch { res(false); }
    });
  },
};

let currentMenu = null;

function positionFloating(m, rect) {

  let left = Math.min(rect.left, innerWidth - w - 10);
  let top = rect.bottom + 6;
  if (top + h > innerHeight - 10) top = Math.max(10, rect.top - h - 6);

      this.blocks.splice(i + 1, 0, nb); this.render(); this.focus(nb.id, 'start'); this.changed();
      return;
    }
    if (e.key === 'Backspace' && selCollapsed() && caretAtStart(el)) {
      if (b.type !== 'text') { e.preventDefault(); b.type = 'text'; this.render(); this.focus(b.id, 'start'); this.changed(); return; }
      if (i > 0) {
        e.preventDefault();
        const prev = this.blocks[i - 1];
        if (TEXTUAL.has(prev.type)) {
          const off = textOf(prev).length;
          prev.text = (prev.text || '') + (b.text || ''); this.blocks.splice(i, 1); this.render(); this.focus(prev.id, off);
        } else { this.blocks.splice(i - 1, 1); this.render(); this.focus(b.id, 'start'); }
        this.changed();
      }
      return;
    }
    if (e.key === 'Delete' && selCollapsed() && caretAtEnd(el)) {
      const next = this.blocks[i + 1]; if (!next) return;
      e.preventDefault();
      if (TEXTUAL.has(next.type)) { const off = textOf(b).length; b.text = (b.text || '') + (next.text || ''); this.blocks.splice(i + 1, 1); this.render(); this.focus(b.id, off); }
      else { this.blocks.splice(i + 1, 1); this.render(); this.focus(b.id, 'end'); }
      this.changed(); return;
    }
    if (e.shiftKey || e.altKey || e.ctrlKey || e.metaKey) return;
    const up = (e.key === 'ArrowUp' && onFirstLine(el)) || (e.key === 'ArrowLeft' && selCollapsed() && caretAtStart(el));
    const down = (e.key === 'ArrowDown' && onLastLine(el)) || (e.key === 'ArrowRight' && selCollapsed() && caretAtEnd(el));
    if (up) { const p = this.prevText(i); if (p) { e.preventDefault(); this.focus(p.id, 'end'); } }
    else if (down) { const n = this.nextText(i); if (n) { e.preventDefault(); this.focus(n.id, 'start'); } }
  }

  onPaste(e) {
    const el = e.target.closest?.('.bc'); if (!el) return;
    const b = this.blockOf(el); if (!b) return;
    const cd = e.clipboardData; if (!cd) return;
    e.preventDefault(); e.stopPropagation();
    const img = [...cd.files].find(f => f.type.startsWith('image/'));
    if (img) {
      fileToDataURL(img).then(src => {
        const at = this.idx(b.id) + 1;
        const ib = B('image', '', { src }); this.blocks.splice(at, 0, ib);
        if (!this.blocks[at + 1]) this.blocks.push(B('text'));
        this.render(); this.changed();
      });
      return;
    }
    const text = (cd.getData('text/plain') || '').replace(/\r/g, '');
    const lines = text.split('\n');
    if (lines.length === 1) { document.execCommand('insertText', false, text); return; }
    document.execCommand('insertText', false, lines[0]);
    b.text = el.innerHTML;
    const at = this.idx(b.id) + 1;
    const nbs = lines.slice(1).map(l => B(LISTY.has(b.type) ? b.type : 'text', esc(l)));
    this.blocks.splice(at, 0, ...nbs);
    this.render(); this.focus(nbs[nbs.length - 1].id, 'end'); this.changed();
  }
}

function startRenameCol(id) {
  const el = $(`.col[data-col="${id}"] .col-name`); if (!el) return;
  const c = getCol(id); const old = c.name;
  el.contentEditable = 'true'; el.focus();
  const r = document.createRange(); r.selectNodeContents(el); sel().removeAllRanges(); sel().addRange(r);
  const finish = keep => { el.removeEventListener('blur', onBlur); c.name = keep ? (el.textContent.trim() || old) : old; save(); renderMain(); };
  const onBlur = () => finish(true);
  el.addEventListener('blur', onBlur);
  el.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
    if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); finish(false); }
  });
}

function moveCol(id, d) {
  const i = state.columns.findIndex(c => c.id === id); const j = i + d;

function deleteCol(id) {
  if (state.columns.length <= 1) { toast('É preciso ter pelo menos uma etapa'); return false; }
  const c = getCol(id); const n = state.posts.filter(p => p.status === id).length;

}

function viewCalendar() {
  const y = ui.cal.getFullYear(), m = ui.cal.getMonth();
  const first = new Date(y, m, 1); const start = addDays(first, -first.getDay());
  const days = new Date(y, m + 1, 0).getDate(); const cells = Math.ceil((first.getDay() + days) / 7) * 7;
  const t = todayISO(); const done = doneSet(); const posts = filtered(state.posts);
  const map = {}; posts.forEach(p => { if (p.date) (map[p.date] ||= []).push(p); });
  let grid = '';
  for (let i = 0; i < cells; i++) {
    const d = addDays(start, i); const iso = toISO(d);
    const list = (map[iso] || []).sort(byTime);
    grid += `<div class="day ${d.getMonth() !== m ? 'other' : ''} ${iso === t ? 'today' : ''}" data-act="day-new" data-date="${iso}" data-drop-date="${iso}">
      <div class="day-head"><span class="day-num">${d.getDate()}</span><span class="day-add">${icon('plus', 12)}</span></div>

    <div class="cal"><div class="cal-wd">${WEEKDAYS.map(w => `<div>${w}</div>`).join('')}</div><div class="cal-grid">${grid}</div></div>
    <aside class="tray" data-drop-date="">
      <div class="tray-head"><span>Sem data</span><span class="count">${nodate.length}</span></div>
      <div class="tray-body">${nodate.map(p => chipHTML(p, done)).join('') || '<p class="muted small" style="margin:4px 2px">Ideias sem data aparecem aqui. Arraste um post para cá para remover a data.</p>'}</div>

function pickProp(anchor, p, k) {

  const N = NETWORKS[p.network];
  const root = $('#modal-root');
  const prevScroll = $('.peek-scroll', root)?.scrollTop || 0;
  root.innerHTML = `<div class="overlay" data-act="overlay"><aside class="peek" role="dialog" aria-label="Post">
    <div class="peek-bar"><span class="crumb">${netBadges(p)} ${esc(netNames(p))} · ${esc(fmtText(p))}</span><div class="spacer"></div>
      <button class="icon-btn" data-act="post-dup" title="Duplicar">${icon('copy')}</button>
      <button class="icon-btn" data-act="post-del" title="Excluir">${icon('trash')}</button>
      <button class="icon-btn" data-act="post-close" title="Fechar (Esc)">${icon('x')}</button></div>
    <div class="peek-scroll">
      <div class="media-slot">${mediaHTML(p)}</div>
      <div class="peek-head ${isDone(p) ? 'is-done' : ''}">${doneCheck(p)}<input class="peek-title" data-f="title" value="${esc(p.title)}" placeholder="Sem título" maxlength="140"></div>
      <div class="props">
        <div class="prop"><span class="prop-l">${icon('check', 14)} Concluído</span><div class="prop-v"><span class="muted small">${isDone(p) ? (p.done ? 'Sim — marcado como finalizado' : `Sim — está na etapa "${esc(getCol(p.status)?.name || '')}"`) : 'Não — clique no círculo ao lado do título'}</span></div></div>
        <div class="prop"><span class="prop-l">${icon('globe', 14)} Rede</span><div class="prop-v"><button class="pillbtn" data-act="pick-network" title="Escolher uma ou mais redes">${netPills(p)}</button></div></div>
        <div class="prop"><span class="prop-l">${icon('layers', 14)} Formato</span><div class="prop-v"><button class="pillbtn" data-act="pick-format" title="Escolher um ou mais formatos">${esc(fmtText(p))}</button></div></div>
        <div class="prop"><span class="prop-l">${icon('flag', 14)} Etapa</span><div class="prop-v"><button class="pillbtn" data-act="pick-status" title="Trocar, criar ou editar etapas">${statusPill(p.status)}</button></div></div>
        <div class="prop"><span class="prop-l">${icon('tag', 14)} Tags</span><div class="prop-v"><button class="pillbtn tags" data-act="pick-tags" title="Escolher, criar ou editar tags">${tagPills(p) || '<span class="faint">Vazio — clique para adicionar</span>'}</button></div></div>
        ${customCols().map(c => `<div class="prop prop-custom"><button class="prop-l prop-lbtn" data-act="peek-prop-menu" data-k="${c.k}" title="Renomear, mudar tipo ou excluir">${icon(propType(c.type).ic, 14)} <span>${esc(c.label)}</span></button><div class="prop-v t-${c.type}">${propInput(p, c, true)}</div></div>`).join('')}
        <div class="prop"><span class="prop-l"></span><div class="prop-v"><button class="btn sm ghost" data-act="peek-add-prop">${icon('plus', 13)} Adicionar propriedade</button></div></div>
        <div class="prop"><span class="prop-l">${icon('calendar', 14)} Data</span><div class="prop-v"><input type="date" data-f="date" value="${p.date}">${isLate(p) ? '<span class="date late">atrasado</span>' : ''}</div></div>
        <div class="prop"><span class="prop-l">${icon('clock', 14)} Horário</span><div class="prop-v"><input type="time" data-f="time" value="${p.time}"></div></div>
      </div>
      <section class="sec"><div class="sec-head"><h3>Legenda</h3><span class="counter" id="cap-count"></span><button class="btn sm" data-act="copy-caption">${icon('copy', 13)} Copiar legenda + hashtags</button></div>
        <textarea class="ta" data-f="caption" placeholder="Escreva a legenda do post…">${esc(p.caption)}</textarea></section>
      <section class="sec"><div class="sec-head"><h3>Hashtags</h3><span class="counter" id="tag-count"></span></div>
        <textarea class="ta sm" data-f="hashtags" placeholder="#socialmedia #marketingdigital">${esc(p.hashtags)}</textarea></section>
      <section class="sec"><div class="sec-head"><h3>Roteiro & notas</h3><span class="counter"></span><button class="btn sm" data-act="post-apply-tpl">${icon('template', 13)} Aplicar template</button></div>
        <div id="post-editor"></div></section>
    </div></aside></div>`;
  $('.peek-scroll', root).scrollTop = prevScroll;
  $$('[data-f]', root).forEach(el => {
    const evt = el.tagName === 'SELECT' || el.type === 'date' || el.type === 'time' ? 'change' : 'input';
    el.addEventListener(evt, () => onPostField(p, el));
  });
  $$('textarea', root).forEach(autosize);
  updateCounters(p);
  const ms = $('.media-slot', root);
  ms.addEventListener('dragover', e => { if (e.dataTransfer.types.includes('Files')) { e.preventDefault(); e.stopPropagation(); ms.classList.add('over'); } });
  ms.addEventListener('dragleave', () => ms.classList.remove('over'));
  ms.addEventListener('drop', e => { ms.classList.remove('over'); const f = [...e.dataTransfer.files].find(x => x.type.startsWith('image/')); if (f) { e.preventDefault(); e.stopPropagation(); setPostImage(p, f); } });
  postEditor = mountEditor($('#post-editor'), p.blocks, () => { touch(p); save(); renderMainSoon(); });
}
function onPostField(p, el) {
  const f = el.dataset.f; p[f] = el.value; touch(p);
  if (f === 'network') { const fm = NETWORKS[p.network].formats; if (!fm.includes(p.format)) p.format = fm[0]; save(); renderPost(); renderMain(); return; }
  if (f === 'status') { p.order = nextOrder(p.status); save(); renderPost(); renderMain(); renderSidebar(); return; }
  if (f === 'date') { save(); renderPost(); renderMain(); renderSidebar(); return; }
  if (f === 'caption' || f === 'hashtags') { autosize(el); updateCounters(p); save(); return; }
  if (f === 'format') { $('.peek .crumb').innerHTML = `${netBadge(p.network)} ${NETWORKS[p.network].name} · ${esc(p.format)}`; }
  save(); renderMainSoon();
}
function autosize(el) { el.style.height = 'auto'; el.style.height = Math.max(el.scrollHeight + 2, el.classList.contains('sm') ? 62 : 120) + 'px'; }
function countTags(s) { return (String(s).match(/#[\p{L}\p{N}_]+/gu) || []).length; }
function updateCounters(p) {
  const lim = Math.min(...nets(p).map(n => NETWORKS[n].limit));
  const len = [...(p.caption || '')].length + (p.hashtags ? [...('\n\n' + p.hashtags)].length : 0);
  const cc = $('#cap-count'); if (cc) { cc.textContent = `${len.toLocaleString('pt-BR')} / ${lim.toLocaleString('pt-BR')} caracteres (com hashtags)`; cc.classList.toggle('bad', len > lim); }
  const tc = $('#tag-count'); if (tc) { const n = countTags(p.hashtags) + countTags(p.caption); tc.textContent = `${n} hashtag${n === 1 ? '' : 's'}`; }
}
async function setPostImage(p, file) {
  try {
    p.image = await fileToDataURL(file); touch(p); save();
    const ms = $('.media-slot'); if (ms) ms.innerHTML = mediaHTML(p);
    renderMain();
  } catch { toast('Não foi possível ler a imagem'); }
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok;
  }
}

function bindGlobal() {
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if (!el) return;
    const f = ACT[el.dataset.act]; if (f) f(el, e);
  });
  document.addEventListener('dblclick', e => {
    const n = e.target.closest('.col-name'); if (n) startRenameCol(n.closest('.col').dataset.col);
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (currentMenu) { closeMenu(); return; }
      if (ui.postId) { closePost(); return; }
      $('.app').classList.remove('nav-open');
    }
  });
  document.addEventListener('paste', e => {
    if (!ui.postId || e.defaultPrevented) return;
    if (e.target.closest?.('input,textarea,[contenteditable="true"]')) return;
    const f = [...(e.clipboardData?.files || [])].find(x => x.type.startsWith('image/'));
    if (f) { e.preventDefault(); setPostImage(getPost(ui.postId), f); }
  });

  // drag posts (kanban + calendar)
  const clearDrop = () => { $$('.over').forEach(x => x.classList.remove('over')); $$('.drop-line').forEach(x => x.remove()); };
  document.addEventListener('dragstart', e => {
    const c = e.target.closest?.('[data-post][draggable="true"]'); if (!c) return;
    ui.drag = c.dataset.post;
    e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', ui.drag);
    setTimeout(() => c.classList.add('dragging'), 0);
  });
  document.addEventListener('dragend', () => { ui.drag = null; $$('.dragging').forEach(x => x.classList.remove('dragging')); clearDrop(); });
  document.addEventListener('dragover', e => {
    if (!ui.drag) { if (e.dataTransfer?.types?.includes('Files')) e.preventDefault(); return; }
    const zone = e.target.closest?.('[data-drop-col],[data-drop-date]');
    if (!zone) { clearDrop(); return; }
    e.preventDefault(); e.dataTransfer.dropEffect = 'move';
    if (!zone.classList.contains('over')) { clearDrop(); zone.classList.add('over'); }
    if (zone.dataset.dropCol !== undefined) {
      const cards = $$('.card:not(.dragging)', zone);
      let idx = cards.findIndex(c => { const r = c.getBoundingClientRect(); return e.clientY < r.top + r.height / 2; });
      if (idx < 0) idx = cards.length;
      if (zone.dataset.idx !== String(idx) || !$('.drop-line', zone)) {
        zone.dataset.idx = idx; $$('.drop-line').forEach(x => x.remove());
        const line = document.createElement('div'); line.className = 'drop-line';
        cards[idx] ? zone.insertBefore(line, cards[idx]) : zone.appendChild(line);
      }
    }
  });
  document.addEventListener('drop', e => {
    if (!ui.drag) { if (e.dataTransfer?.types?.includes('Files')) e.preventDefault(); return; }
    const zone = e.target.closest?.('[data-drop-col],[data-drop-date]');
    const p = getPost(ui.drag);
    if (!zone || !p) { clearDrop(); return; }
    e.preventDefault();
    if (zone.dataset.dropCol !== undefined) {
      const col = zone.dataset.dropCol; const idx = +zone.dataset.idx || 0;
      const list = state.posts.filter(x => x.status === col && x.id !== p.id).sort((a, b) => (a.order || 0) - (b.order || 0));
      list.splice(Math.min(idx, list.length), 0, p);
      list.forEach((x, i) => (x.order = i));
      p.status = col;
    } else {
      p.date = zone.dataset.dropDate;
    }
    touch(p); ui.drag = null; clearDrop(); save(); renderMain(); renderSidebar();
  });

  // list view: inline edits, toolbar
  document.addEventListener('change', e => {
    const f = e.target.closest?.('[data-lf]'); if (f) { onListField(f); return; }
    const pf = e.target.closest?.('[data-pf]'); if (pf) { onPropField(pf); return; }
    const o = e.target.closest?.('[data-lopt]');
    if (o) { ui.list[o.dataset.lopt] = o.value; ui.list.collapsed.clear(); renderListBody(); return; }
    const oc = e.target.closest?.('[data-lopt-check]');
    if (oc) { ui.list[oc.dataset.loptCheck] = oc.checked; renderListBody(); }
  });
  document.addEventListener('input', e => {
    if (e.target.id === 'list-q') { ui.list.q = e.target.value; renderListBody(); }
  });

  // redimensionar colunas da Lista
  document.addEventListener('pointerdown', e => { const h = e.target.closest?.('.lh-resize'); if (h && e.button === 0) startColResize(e, h); });
  document.addEventListener('dblclick', e => {
    const h = e.target.closest?.('.lh-resize'); if (!h) return;
    delete state.settings.listWidths[h.dataset.resize]; save(); renderListBody();
    const r = $('#list-reset'); if (r) r.hidden = !Object.keys(state.settings.listWidths).length;
  });

  window.addEventListener('hashchange', route);
  window.addEventListener('beforeunload', () => { if (dirty) flush(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden) flush(); });
}

// navegação síncrona (hashchange é assíncrono e podia perder digitação logo após trocar de tela)
function go(h) {
  if (location.hash !== '#/' + h) history.pushState(null, '', '#/' + h);
  route();
}
function route() {
  const h = location.hash.replace(/^#\/?/, '') || 'dashboard';
  const [v, id] = h.split('/');
  ui.view = ['dashboard', 'calendar', 'kanban', 'list', 'templates', 'settings', 'page', 'template'].includes(v) ? v : 'dashboard';
  ui.docId = id || null;
  closeMenu(); killSlash();
  if (ui.postId) { ui.postId = null; $('#modal-root').innerHTML = ''; }
  $('.app').classList.remove('nav-open');
  renderSidebar(); renderMain();
}

const NUVEM_URL = 'https://script.google.com/macros/s/AKfycbxoO8468rX7jOFg6FnXSbtuFPCjtnyB9JEaH-sZ0tCwrBV90wVN7YCq6DbBWtz_PhzWBQ/exec';
const Nuvem = {
  rev: null, ativa: false, ultimo: null,
  // updatedAt fica de fora: o editor do post o renova só de abrir, e isso não é alteração de ninguém.
  txt(st) { return JSON.stringify(st, (k, v) => k === 'updatedAt' ? undefined : v); },
  igual(st) { return this.txt(st) === this.ultimo; },
  marca(st) { this.ultimo = this.txt(st); },
  chave() {
    let c = localStorage.getItem('socialos-chave');
    if (!c) { c = prompt('Senha do SocialOS da equipe:') || ''; localStorage.setItem('socialos-chave', c); }
    return c;
  },
  async ler(so) {
    const r = await fetch(NUVEM_URL + '?chave=' + encodeURIComponent(this.chave()) + (so ? '&so=rev' : ''));
    const j = await r.json();
    if (j.erro === 'senha') { localStorage.removeItem('socialos-chave'); throw new Error('senha'); }
    return j;
  },
  async abrir(local) {
    if (!NUVEM_URL.startsWith('https://')) return local;
    for (let t = 0; t < 3; t++) {
      try {
        const j = await this.ler();
        this.ativa = true; this.rev = j.rev;
        if (j.state) { this.marca(j.state); await DB.set('state', j.state); return j.state; }
        if (local) await this.gravar(local);
        return local;
      } catch (e) { if (e.message !== 'senha') break; alert('Senha errada. Tente de novo.'); }
    }
    this.ativa = false;
    setTimeout(() => toast('Sem conexão com a pasta da equipe: o que fizer agora fica só neste navegador.'), 800);
    return local;
  },
  async gravar(st) {
    await DB.set('state', st);
    if (!this.ativa || this.igual(st)) return true;
    try {
      const r = await fetch(NUVEM_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ chave: this.chave(), base: this.rev, state: st }) });
      const j = await r.json();
      if (j.conflito) {
        this.rev = j.rev; this.marca(j.state);
        if (this.txt(j.state) === this.txt(st)) return true;
        state = migrate(j.state || st); await DB.set('state', state); route();
        toast('Outra pessoa salvou antes: a tela mostra a versão dela. Refaça a sua última alteração.');
        return true;
      }
      if (j.erro) return false;
      this.rev = j.rev; this.marca(st); return true;
    } catch { return false; }
  },
  ocupado() {
    const a = document.activeElement;
    return dirty || ui.drag || ui.postId || (a && (/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName) || a.isContentEditable));
  },
  aviso(mostrar) {
    let b = document.getElementById('nuvem-aviso');
    if (!mostrar) { if (b) b.remove(); return; }
    if (b) return;
    b = document.createElement('button'); b.id = 'nuvem-aviso';
    b.textContent = 'A equipe alterou o SocialOS. Clique para atualizar';
    b.style.cssText = 'position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:9999;padding:10px 18px;border-radius:999px;border:0;background:#A41815;color:#fff;font:600 14px system-ui;box-shadow:0 6px 20px rgba(0,0,0,.25);cursor:pointer';
    b.onclick = () => { if (document.activeElement) document.activeElement.blur(); flush().then(() => Nuvem.vigiar(true)); };
    document.body.appendChild(b);
  },
  async vigiar(forcar) {
    if (!this.ativa || document.hidden || (this.lendo && !forcar)) return;
    this.lendo = true;
    try {
      const j = await this.ler(true);
      if (j.rev === this.rev) { this.aviso(false); return; }
      if (!forcar && this.ocupado()) { this.aviso(true); return; }
      const k = await this.ler();
      if (dirty) return;
      this.rev = k.rev; this.marca(k.state); this.aviso(false);
      if (this.txt(k.state) === this.txt(state)) return;
      state = migrate(k.state); await DB.set('state', state); route();
    } catch { } finally { this.lendo = false; }
  },
};
setInterval(() => Nuvem.vigiar(), 3000);
document.addEventListener('focusout', () => setTimeout(() => Nuvem.vigiar(), 300));
document.addEventListener('visibilitychange', () => { if (!document.hidden) Nuvem.vigiar(); });

/* ---------------- boot ---------------- */
(async function init() {
  await DB.open();
  const stored = await Nuvem.abrir(await DB.get('state'));
  state = migrate(stored || seed());
  if (!stored) { save(); }
  try { navigator.storage?.persist?.(); } catch { }
  applyTheme();
  bindGlobal();
  route();
  setInterval(() => { if (ui.view === 'dashboard' && !ui.postId && !document.hidden) renderMain(); }, 60000);
})();

</script>
</body>
</html>
